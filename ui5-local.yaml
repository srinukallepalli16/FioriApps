specVersion: "4.0"
metadata:
  name: zempcrud
type: application
framework:
  name: SAPUI5
  version: 1.146.0
  libraries:
    - name: sap.collaboration
    - name: sap.m
    - name: sap.ui.comp
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: sap.ushell
    - name: sap.uxap
    - name: sap.f
    - name: sap.ui.generic.app
    - name: sap.ui.table
    - name: themelib_sap_bluecrystal
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false
        backend:
          - path: /sap
            url: http://prowessdc02:8011
            client: "100"
            destination: IDS_System
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        component: ZEMPCRUD
        ui5Theme: sap_horizon
